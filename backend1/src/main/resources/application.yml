server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: backend1
  datasource:
    url: jdbc:h2:mem:employee_attendance_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-change-this}
  expiration-ms: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.hrchomnan.backend1: DEBUG
