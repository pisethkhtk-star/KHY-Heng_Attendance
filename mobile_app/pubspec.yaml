name: mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  provider: ^6.1.5+1
  google_fonts: ^8.2.1
  intl: ^0.20.3
  flutter_animate: ^4.5.2
  http: ^1.6.0
  dio: ^5.7.0
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  shimmer: ^3.0.0
  mobile_scanner: ^6.0.2
  lucide_icons_flutter: ^3.1.15
  permission_handler: ^13.0.1
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png

