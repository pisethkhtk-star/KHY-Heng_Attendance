services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    image: frontend:latest
    container_name: hr_attendance_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      TZ: Asia/Phnom_Penh
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
