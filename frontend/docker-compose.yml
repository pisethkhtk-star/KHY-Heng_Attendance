services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: hr-chomnan-frontend:latest
    container_name: hr_attendance_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    extra_hosts:
      - "backend:${BACKEND_HOST:-52.54.142.123}"
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Phnom_Penh
    networks:
      - app-network

networks:
  app-network:
    name: hr_frontend_network
    driver: bridge
