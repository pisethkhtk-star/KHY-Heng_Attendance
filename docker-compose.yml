services:
  postgres:
    image: postgres:16-alpine
    container_name: hr_attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-khyheng_att}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      TZ: Asia/Phnom_Penh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-khyheng_att}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hr-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hr-chomnan-backend:latest
    container_name: hr_attendance_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-khyheng_att}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-hr-chomnan-dev-secret-key-please-change-32chars}
      TZ: Asia/Phnom_Penh
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - hr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: hr-chomnan-frontend:latest
    container_name: hr_attendance_frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Phnom_Penh
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hr-network

networks:
  hr-network:
    name: hr_attendance_network
    driver: bridge

volumes:
  postgres_data:
    name: hr_attendance_postgres_data
    driver: local
