server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /api

spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/employee_attendance_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:changeme_in_production}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  # IMPORTANT: Set JWT_SECRET env var in production! (min 32 chars, random strong key)
  secret: ${JWT_SECRET:hr-chomnan-dev-secret-key-please-change-32chars}
  expiration-ms: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.hrchomnan.backend: INFO
